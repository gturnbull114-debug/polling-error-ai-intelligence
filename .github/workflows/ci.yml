name: CI Pipeline - Agentic AI Solution

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify Required Submission Files
        run: |
          echo "Checking presence of required assignment files..."
          test -f README.md || (echo "README.md is missing!" && exit 1)
          test -f AGENTS.md || (echo "AGENTS.md is missing!" && exit 1)
          test -f .env.example || (echo ".env.example is missing!" && exit 1)
          test -f .gitignore || (echo ".gitignore is missing!" && exit 1)
          echo "All required submission files present."

      - name: Secrets Hygiene Check
        run: |
          echo "Verifying no .env files or credentials leaked..."
          if [ -f .env ]; then
            echo "ERROR: .env file found in workspace! Secrets must not be tracked in git."
            exit 1
          fi
          echo "No untracked secret files detected."

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics || true
          # Exit-zero treats all errors as warnings
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics || true

      - name: Run Test Suite with Pytest
        run: |
          pytest -v
